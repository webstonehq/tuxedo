#:schema https://mise.jdx.dev/schema/mise.json

[settings]
lockfile = true

[tools]
rust = "latest"
lefthook = "latest"

[tasks.clippy]
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt_check]
run = { task = "fmt", args = ["--check"] }

[tasks.tuxedo]
run = "cargo run --bin tuxedo --"
description = "Run the in-development tuxedo executable. `mise run tuxedo -- <args>` for CLI commands"

[tasks.preflight]
description = "Prepare and verify changes ready for PR submission"
run = [ # Run fmt serially first so other tasks won't see files mid-write
    { task = "fmt" },
    { tasks = ["clippy", "test"] },
]

[tasks.test]
run = "cargo test --locked"

[tasks.test_update_snapshots]
run = "INSTA_UPDATE=always cargo test --test snapshots --locked"

[tasks.screenshots]
run = "cargo run --example screenshots"

[tasks.demo]
description = "Record the README hero GIF via vhs (requires vhs on PATH)."
run = [
    "cargo build --release",
    "vhs docs/demo.tape",
]
